<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D0D0CB" />
      <stop offset="100%" stop-color="#80807B" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#DCDCD7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Glass Border -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="#262626" stroke-width="6" />

  <!-- Ambient Internal Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#core-glow)" filter="url(#subtle-blur)" opacity="0.3" />

  <!-- Outer Interlocking Geometric Neural Orbital Rings -->
  <circle cx="256" cy="256" r="148" stroke="url(#silver-grad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.4" />
  <circle cx="256" cy="256" r="112" stroke="url(#silver-grad)" stroke-width="10" opacity="0.75" />

  <!-- Quad-Modality Connected Nodes (Text, Vision, Audio, Deep Thought) -->
  <g stroke="url(#silver-grad)" stroke-width="7" opacity="0.9">
    <!-- Diagonals connecting modalities to core -->
    <line x1="168" y1="168" x2="344" y2="344" />
    <line x1="344" y1="168" x2="168" y2="344" />
    <line x1="256" y1="120" x2="256" y2="392" />
    <line x1="120" y1="256" x2="392" y2="256" />
  </g>

  <!-- Modality Peripheral Nodes -->
  <circle cx="256" cy="120" r="14" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4" />
  <circle cx="256" cy="392" r="14" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4" />
  <circle cx="120" cy="256" r="14" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4" />
  <circle cx="392" cy="256" r="14" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4" />

  <circle cx="168" cy="168" r="12" fill="#E5E5E0" stroke="#0A0A0A" stroke-width="3" />
  <circle cx="344" cy="168" r="12" fill="#E5E5E0" stroke="#0A0A0A" stroke-width="3" />
  <circle cx="168" cy="344" r="12" fill="#E5E5E0" stroke="#0A0A0A" stroke-width="3" />
  <circle cx="344" cy="344" r="12" fill="#E5E5E0" stroke="#0A0A0A" stroke-width="3" />

  <!-- Center Core Mind Orb -->
  <circle cx="256" cy="256" r="48" fill="url(#silver-grad)" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="256" cy="256" r="24" fill="#0A0A0A" />
  <circle cx="256" cy="256" r="10" fill="#FFFFFF" />
</svg>
